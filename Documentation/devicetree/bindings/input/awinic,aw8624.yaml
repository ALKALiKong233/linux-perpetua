%YAML 1.2
---
$id: http://devicetree.org/schemas/input/awinic,aw8624.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW8624 LRA Haptic IC

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

properties:
  compatible:
    const: awinic,aw8624

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active-low hardware reset.

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reset-gpios
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        vibrator@5a {
            compatible = "awinic,aw8624";
            reg = <0x5a>;
            interrupt-parent = <&tlmm>;
            interrupts = <18 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&tlmm 35 GPIO_ACTIVE_LOW>;
        };
    };
...
